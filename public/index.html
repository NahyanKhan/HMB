<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mane Bazar — My shop</title>
    <meta name="description"
        content="Your home business, beautifully organised. A Kannada and English seller app for Hubballi.">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23512da8'/%3E%3Cpath d='M9 19L20 9l11 10v13H9Z' fill='%23ffcc57'/%3E%3Cpath d='M17 32V21h6v11' fill='%23512da8'/%3E%3C/svg%3E">
    <style>
        :root {
            --purple: #5634ab;
            --deep: #30234b;
            --muted: #746d80;
            --line: #e8e3ee;
            --bg: #f7f6fa;
            --green: #19704a;
            --yellow: #ffcc57;
            --white: #fff
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            font: 16px/1.55 'DM Sans', 'Noto Sans Kannada', sans-serif;
            color: var(--deep)
        }

        button,
        input,
        select,
        textarea {
            font: inherit
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent
        }

        button {
            cursor: pointer
        }

        button {
            border: 0
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #e79719;
            outline-offset: 3px
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        a {
            color: var(--purple)
        }

        .shell {
            display: grid;
            grid-template-columns: 242px 1fr;
            min-height: 100vh
        }

        .sidebar {
            background: white;
            border-right: 1px solid var(--line);
            padding: 32px 22px;
            display: flex;
            flex-direction: column;
            position: fixed;
            inset: 0 auto 0 0;
            width: 242px;
            z-index: 5
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -.8px
        }

        .brandmark {
            background: var(--purple);
            color: var(--yellow);
            width: 42px;
            height: 44px;
            border-radius: 14px;
            display: grid;
            place-items: center
        }

        .icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0
        }

        .brandmark .icon {
            width: 27px;
            height: 27px
        }

        .brand-sub {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--muted);
            margin: 5px 0 35px 53px
        }

        .nav {
            display: grid;
            gap: 8px
        }

        .nav button {
            background: none;
            color: var(--muted);
            text-align: left;
            display: flex;
            gap: 13px;
            align-items: center;
            padding: 14px 16px;
            border-radius: 13px;
            font-weight: 500
        }

        .nav button.active {
            background: #eee8fa;
            color: var(--purple);
            font-weight: 700
        }

        .nav .count {
            margin-left: auto;
            background: var(--purple);
            color: white;
            border-radius: 7px;
            padding: 0 7px;
            font-size: 13px
        }

        .sidebar-bottom {
            margin-top: auto
        }

        .help-card {
            background: #f7f4fc;
            border: 1px solid #e9e0f8;
            border-radius: 17px;
            padding: 17px;
            margin: 35px 0 20px
        }

        .help-card p {
            font-size: 14px;
            color: var(--muted);
            margin: 6px 0 12px
        }

        .text-btn {
            background: none;
            color: var(--purple);
            font-weight: 700;
            padding: 0
        }

        .profile {
            border-top: 1px solid var(--line);
            padding-top: 22px;
            display: flex;
            gap: 10px;
            align-items: center
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #f3d6b8;
            color: #75461e;
            display: grid;
            place-items: center;
            font-weight: 700
        }

        .profile small {
            display: block;
            color: var(--muted);
            font-size: 12px
        }

        .main {
            grid-column: 2
        }

        .topbar {
            height: 85px;
            padding: 0 42px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
            background: #fff
        }

        .crumb {
            font-size: 14px;
            color: var(--muted)
        }

        .crumb strong {
            color: var(--deep);
            margin-left: 8px
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 17px
        }

        .lang {
            display: flex;
            border: 1px solid var(--line);
            padding: 4px;
            border-radius: 10px
        }

        .lang button {
            font-size: 14px;
            background: transparent;
            color: var(--muted);
            border-radius: 7px;
            padding: 5px 10px
        }

        .lang button.selected {
            background: var(--purple);
            color: white
        }

        .circle-btn {
            background: #f7f5fa;
            border: 1px solid var(--line);
            border-radius: 50%;
            height: 39px;
            width: 39px;
            display: grid;
            place-items: center;
            color: var(--purple)
        }

        .content {
            max-width: 1320px;
            margin: auto;
            padding: 30px 42px 50px
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: center;
            margin-bottom: 24px
        }

        .eyebrow {
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 5px
        }

        .page-heading h1 {
            font-size: 30px;
            letter-spacing: -1px;
            line-height: 1.4;
            margin: 0;
            font-weight: 700
        }

        .page-heading .sub {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 15px
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border-radius: 30px;
            padding: 7px 13px;
            font-size: 13px;
            font-weight: 600;
            background: #e4f4e9;
            color: var(--green);
            white-space: nowrap
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor
        }

        .hero {
            border-radius: 23px;
            overflow: hidden;
            background: var(--purple);
            color: white;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            min-height: 224px;
            margin-bottom: 25px;
            position: relative
        }

        .hero-copy {
            padding: 29px 32px;
            z-index: 1
        }

        .hero .eyebrow {
            color: #e4d8ff;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            font-size: 12px;
            font-weight: 700
        }

        .hero h2 {
            font-size: 29px;
            line-height: 1.35;
            letter-spacing: -.6px;
            margin: 10px 0
        }

        .hero p {
            color: #e8e0f8;
            margin: 0 0 20px;
            font-size: 15px;
            max-width: 360px
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 18px;
            border-radius: 11px;
            background: var(--purple);
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid transparent;
            min-height: 45px
        }

        .btn.yellow {
            background: var(--yellow);
            color: #3c2b16
        }

        .btn.secondary {
            background: white;
            border-color: var(--line);
            color: var(--deep)
        }

        .btn.green {
            background: var(--green)
        }

        .btn.small {
            min-height: 38px;
            padding: 7px 12px;
            font-size: 14px
        }

        .hero-art {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #6543b8;
            overflow: hidden
        }

        .hero-art img {
            width: 100%;
            height: 100%;
            position: absolute;
            object-fit: cover
        }

        .hero-art:after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #5634ab 0%, transparent 45%)
        }

        .hero-label {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #fff;
            color: var(--deep);
            padding: 10px 17px;
            border-radius: 12px;
            z-index: 1;
            box-shadow: 0 5px 20px #0002;
            font-size: 14px
        }

        .hero-label strong {
            display: block
        }

        .hero-label small {
            color: var(--muted)
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 28px
        }

        .stat {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 17px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 15px
        }

        .stat-icon {
            height: 45px;
            width: 45px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: #eee7fa;
            color: var(--purple)
        }

        .stat:nth-child(2) .stat-icon {
            background: #e6f4e9;
            color: var(--green)
        }

        .stat:nth-child(3) .stat-icon {
            background: #fff1d3;
            color: #96620c
        }

        .stat p {
            font-size: 14px;
            margin: 0;
            color: var(--muted)
        }

        .stat strong {
            font-size: 25px;
            letter-spacing: -.5px
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.65fr) minmax(260px, 1fr);
            gap: 24px
        }

        .panel {
            border: 1px solid var(--line);
            background: white;
            border-radius: 19px;
            padding: 23px;
            margin-bottom: 23px
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 18px
        }

        .section-head h2 {
            font-size: 19px;
            letter-spacing: -.4px;
            margin: 0
        }

        .section-head button {
            font-size: 14px
        }

        .section-head small {
            color: var(--muted)
        }

        .order-row {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 17px 0;
            border-top: 1px solid #f0edf4
        }

        .order-thumb {
            width: 53px;
            height: 53px;
            object-fit: cover;
            border-radius: 12px;
            background: #f5e8cd
        }

        .order-info {
            flex: 1;
            min-width: 0
        }

        .order-info strong {
            font-size: 15px
        }

        .order-info p {
            font-size: 13px;
            color: var(--muted);
            margin: 3px 0
        }

        .order-price {
            text-align: right;
            font-weight: 700;
            font-size: 15px
        }

        .order-price small {
            font-size: 12px;
            font-weight: 500;
            display: block;
            color: #a05e08
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 13px
        }

        .action-tile {
            padding: 17px 13px;
            background: #f0eafa;
            text-align: left;
            border-radius: 13px;
            color: var(--purple);
            display: grid;
            gap: 9px
        }

        .action-tile:nth-child(2) {
            background: #e5f2e9;
            color: #216342
        }

        .action-tile:nth-child(3) {
            background: #fff1d6;
            color: #855907
        }

        .action-tile:nth-child(4) {
            background: #fae9e6;
            color: #954d40
        }

        .action-tile span {
            font-size: 14px;
            font-weight: 600
        }

        .tip {
            background: #fff5d9;
            border: 1px solid #f5e2ae;
            border-radius: 18px;
            padding: 21px
        }

        .tip h3 {
            font-size: 16px;
            margin: 0 0 7px
        }

        .tip p {
            font-size: 14px;
            line-height: 1.7;
            color: #7c622f;
            margin: 0
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 17px
        }

        .product {
            border: 1px solid var(--line);
            border-radius: 15px;
            overflow: hidden;
            background: white
        }

        .product .photo {
            position: relative;
            height: 145px;
            background: #f4ede1
        }

        .product img {
            height: 100%;
            width: 100%;
            object-fit: cover
        }

        .photo .pill {
            position: absolute;
            left: 10px;
            top: 10px;
            font-size: 11px;
            padding: 4px 8px;
            background: #fffdf5
        }

        .product-body {
            padding: 14px
        }

        .product h3 {
            font-size: 16px;
            margin: 0 0 4px
        }

        .product p {
            font-size: 13px;
            color: var(--muted);
            margin: 0 0 11px
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        .product-bottom strong {
            font-size: 16px
        }

        .product-bottom button {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--purple);
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 13px
        }

        .demo-note {
            color: var(--muted);
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 28px
        }

        .mobile-brand {
            display: none
        }

        #toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 22px;
            background: var(--deep);
            color: white;
            border-radius: 12px;
            box-shadow: 0 8px 25px #0002;
            z-index: 30;
            max-width: 90%;
            display: none
        }

        #toast.show {
            display: block
        }

        dialog {
            width: min(530px, 94vw);
            padding: 27px;
            border: 0;
            border-radius: 22px;
            box-shadow: 0 25px 80px #0003;
            color: var(--deep)
        }

        dialog::backdrop {
            background: #25163888;
            backdrop-filter: blur(3px)
        }

        dialog h2 {
            margin: 0 0 8px;
            font-size: 23px
        }

        dialog p {
            color: var(--muted);
            font-size: 14px
        }

        .dialog-head {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 15px
        }

        label {
            display: grid;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            margin: 16px 0
        }

        input,
        select,
        textarea {
            border: 1px solid #dcd4e6;
            border-radius: 10px;
            padding: 11px 12px;
            width: 100%;
            color: var(--deep);
            background: white;
            min-height: 45px
        }

        textarea {
            resize: vertical
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 23px
        }

        .muted {
            color: var(--muted)
        }

        .tabs {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            margin-bottom: 22px
        }

        .tabs button {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 30px;
            padding: 8px 16px;
            color: var(--muted)
        }

        .tabs button.active {
            background: var(--purple);
            color: #fff;
            border-color: var(--purple)
        }

        .order-card {
            background: white;
            border: 1px solid var(--line);
            border-radius: 17px;
            padding: 22px;
            margin-bottom: 16px
        }

        .order-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px
        }

        .order-card h3 {
            margin: 0;
            font-size: 18px
        }

        .order-detail {
            display: flex;
            gap: 15px;
            align-items: center;
            margin: 17px 0
        }

        .order-detail p {
            margin: 3px 0;
            font-size: 14px
        }

        .order-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-top: 1px solid var(--line);
            padding-top: 15px;
            flex-wrap: wrap
        }

        .status {
            padding: 5px 10px;
            font-size: 13px;
            border-radius: 8px;
            background: #fff1d3;
            color: #8e5d0f
        }

        .status.accepted,
        .status.ready,
        .status.completed {
            background: #e6f4e9;
            color: var(--green)
        }

        .status.declined {
            background: #f9e7e7;
            color: #a33737
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: var(--muted)
        }

        .ledger-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            padding: 18px 0;
            border-top: 1px solid var(--line)
        }

        .ledger-row p {
            margin: 3px 0;
            color: var(--muted);
            font-size: 14px
        }

        .passport {
            background: linear-gradient(135deg, #503097, #7451bf);
            padding: 30px;
            border-radius: 20px;
            color: white;
            margin-bottom: 23px
        }

        .passport .eyebrow {
            color: #e1d4fa
        }

        .passport h2 {
            font-size: 28px;
            margin: 10px 0 5px
        }

        .passport .pill {
            background: #ffffff25;
            color: white
        }

        .passport-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px
        }

        .passport-grid strong {
            display: block;
            font-size: 28px
        }

        .passport-grid span {
            font-size: 14px;
            color: #ece5fa
        }

        .bar-chart {
            display: flex;
            align-items: end;
            gap: 20px;
            height: 160px;
            padding-top: 20px
        }

        .bar-col {
            flex: 1;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: end;
            gap: 6px;
            font-size: 13px;
            color: var(--muted)
        }

        .bar {
            border-radius: 7px 7px 0 0;
            background: #b6a2df;
            min-height: 8px
        }

        .bar-col:last-child .bar {
            background: var(--purple)
        }

        .chat {
            max-width: 760px;
            margin: auto;
            background: #eaf0e8;
            border-radius: 19px;
            overflow: hidden;
            border: 1px solid #d8e1d6
        }

        .chat-header {
            padding: 18px 23px;
            background: #176c51;
            color: white;
            display: flex;
            gap: 12px;
            align-items: center
        }

        .chat-header small {
            display: block;
            opacity: .8
        }

        .chat-body {
            padding: 25px;
            display: grid;
            gap: 15px;
            min-height: 280px
        }

        .bubble {
            background: white;
            padding: 14px 17px;
            border-radius: 2px 15px 15px 15px;
            max-width: 90%;
            font-size: 15px;
            box-shadow: 0 2px 5px #00000007
        }

        .bubble.out {
            background: #d3f7c8;
            justify-self: end;
            border-radius: 15px 2px 15px 15px
        }

        .bubble small {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-top: 6px
        }

        .chat-compose {
            padding: 18px;
            background: #f7faf6
        }

        .chat-compose form {
            display: flex;
            gap: 10px
        }

        .chat-note {
            font-size: 13px;
            color: var(--muted);
            margin: 12px 0 0
        }

        .wide-products {
            grid-template-columns: repeat(3, 1fr)
        }

        .credits li {
            margin-bottom: 15px;
            font-size: 14px
        }

        .notice {
            background: #f1edf9;
            border-radius: 12px;
            padding: 14px 17px;
            font-size: 14px;
            margin: 15px 0
        }

        .window-card {
            background: #fff4d6;
            border: 1px solid #efdfaf;
            border-radius: 13px;
            padding: 15px;
            margin-top: 15px
        }

        .window-card p {
            margin: 0;
            font-size: 14px
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center
        }

        .currency {
            font-variant-numeric: tabular-nums
        }

        @media(min-width:1450px) {
            .content {
                padding-top: 38px
            }

            .hero {
                min-height: 250px
            }

            .hero-copy {
                padding: 32px 38px
            }
        }

        @media(max-width:1100px) {
            .sidebar {
                width: 205px;
                padding: 25px 15px
            }

            .shell {
                grid-template-columns: 205px 1fr
            }

            .topbar {
                padding: 0 25px
            }

            .content {
                padding: 25px
            }

            .dashboard-grid {
                grid-template-columns: 1fr
            }

            .dashboard-right {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px
            }

            .dashboard-right .panel {
                margin-bottom: 0
            }

            .products {
                gap: 12px
            }

            .stat {
                padding: 15px 12px;
                gap: 10px
            }

            .stat strong {
                font-size: 22px
            }

            .hero h2 {
                font-size: 26px
            }

            .hero-copy {
                padding: 25px
            }

            .hero-art {
                min-width: 210px
            }
        }

ಣೆ ಕೋರಲಾಗಿದೆ')}</p></div><div class="order-price">${money(p.price * o.qty)}<small>${statusLabel(o.status)}</small></div></div>` }).join('') || `<p class="muted">${t('You’re all caught up!', 'ಎಲ್ಲಾ ಕೆಲಸಗಳು ಮುಗಿದಿವೆ!')}</p>`}</section><section class="panel"><div class="section-head"><h2>${t('Fresh from your shop', 'ನಿಮ್ಮ ಅಂಗಡಿಯ ಉತ್ಪನ್ನಗಳು')}</h2><button class="text-btn" onclick="navigate('products')">${t('View shop', 'ಅಂಗಡಿ ನೋಡಿ')}</button></div><div class="products">${products.slice(0, 3).map(productCard).join('')}</div></section></div><div class="dashboard-right"><section class="panel"><div class="section-head"><h2>${t('What would you like to do?', 'ನೀವು ಏನು ಮಾಡಲು ಬಯಸುತ್ತೀರಿ?')}</h2></div><div class="action-grid"><button class="action-tile" onclick="navigate('chat')">${icon('mic')}<span>${t('Speak to add', 'ಮಾತನಾಡಿ ಸೇರಿಸಿ')}</span></button><button class="action-tile" onclick="navigate('orders')">${icon('bag')}<span>${t('See my orders', 'ಆರ್ಡರ್‌ಗಳನ್ನು ನೋಡಿ')}</span></button><button class="action-tile" onclick="openWindow()">${icon('clock')}<span>${t('Open pre-orders', 'ಮುಂಗಡ ಆರ್ಡರ್ ತೆರೆಯಿರಿ')}</span></button><button class="action-tile" onclick="navigate('money')">${icon('wallet')}<span>${t('Check my money', 'ಹಣದ ವಿವರ ನೋಡಿ')}</span></button></div></section><div class="tip"><h3>✦ ${t('Small batches. Less worry.', 'ಸ್ವಲ್ಪ ತಯಾರಿ. ಕಡಿಮೆ ಚಿಂತೆ.')}</h3><p>${t('Taking orders for tomorrow? Set a limit and a closing time. Make only what your customers order.', 'ನಾಳೆಗಾಗಿ ಆರ್ಡರ್ ಪಡೆಯುತ್ತೀರಾ? ಮಿತಿ ಮತ್ತು ಕೊನೆಯ ಸಮಯ ನಿಗದಿಪಡಿಸಿ. ಆರ್ಡರ್ ಬಂದಷ್ಟೇ ತಯಾರಿಸಿ.')}</p><button class="text-btn" style="margin-top:13px;color:#855907" onclick="openWindow()">${t('Set an order window', 'ಆರ್ಡರ್ ಸಮಯ ನಿಗದಿಪಡಿಸಿ')}</button></div></div></div>` }
        function showModal(html) { let d = document.getElementById('modal'); d.innerHTML = html; d.showModal() }

        function credits() { showModal(modalHead(t('About these images', 'ಈ ಚಿತ್ರಗಳ ಬಗ್ಗೆ')) + `<p>${t('Product photos are illustrative references, not photographs of this sample seller’s products. Images are cropped to fit.', 'ಉತ್ಪನ್ನದ ಚಿತ್ರಗಳು ಉದಾಹರಣೆಗಾಗಿ ಮಾತ್ರ. ಇವು ಈ ಮಾದರಿ ಮಾರಾಟಗಾರರ ನಿಜವಾದ ಉತ್ಪನ್ನಗಳ ಚಿತ್ರಗಳಲ್ಲ. ಚಿತ್ರಗಳನ್ನು ಹೊಂದುವಂತೆ ಕತ್ತರಿಸಲಾಗಿದೆ.')}</p><ul class="credits"><li><a href="https://commons.wikimedia.org/wiki/File:Chakli.jpg" target="_blank" rel="noopener">Chakli — Essh2981</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a></li><li><a href="https://commons.wikimedia.org/wiki/File:Dharwad_peda.jpg" target="_blank" rel="noopener">Dharwad peda — Pamri</a> · Public domain</li><li><a href="https://commons.wikimedia.org/wiki/File:Mangopickle.jpg" target="_blank" rel="noopener">Mango pickle — MrAngryEyes</a> · Public domain</li></ul>`) }
        function heading(title, sub, action = '') { return `<div class="page-heading"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>` }
        function orderAction(id, status) { let o = orders.find(x => x.id === id); if (!o) return; let allowed = { new: ['accepted', 'declined'], accepted: ['ready'], ready: ['completed'] }; if (!allowed[o.status]?.includes(status)) return; o.status = status; render(); toast(t('Order updated', 'ಆರ್ಡರ್ ಬದಲಿಸಲಾಗಿದೆ')) }
        function orderCard(o) { let p = products.find(p => p.id === o.product); return `<article class="order-card"><div class="order-card-head"><div><h3>${esc(o.name)}</h3><small class="muted">#MB${o.id} · ${t(o.area, o.areaKn)}</small></div><span class="status ${o.status}">${statusLabel(o.status)}</span></div><div class="order-detail">${photo(p, 'order-thumb')}<div style="flex:1"><strong>${o.qty} × ${esc(pname(p))}</strong><p>${esc(punit(p))}</p></div><strong>${money(p.price * o.qty)}</strong></div><div class="order-card-footer"><div><small>${o.delivery === 'pickup' ? t('Pickup · Tomorrow, 10 AM–12 PM', 'ಬಂದು ಪಡೆಯುವುದು · ನಾಳೆ, ಬೆಳಿಗ್ಗೆ 10–12') : t('Delivery requested · Tomorrow', 'ವಿತರಣೆ ಕೋರಲಾಗಿದೆ · ನಾಳೆ')}</small><p class="muted" style="font-size:13px;margin:3px 0">${o.paid ? t('Payment: seller-confirmed', 'ಪಾವತಿ: ಮಾರಾಟಗಾರರು ದೃಢಪಡಿಸಿದ್ದಾರೆ') : t('Payment: pending', 'ಪಾವತಿ: ಬಾಕಿ ಇದೆ')}</p></div><div class="toolbar">${o.status === 'new' ? `<button class="btn secondary small" onclick="confirmDecline(${o.id})">${t('Decline', 'ನಿರಾಕರಿಸಿ')}</button><button class="btn green small" onclick="orderAction(${o.id},'accepted')">${icon('check')}${t('Accept', 'ಸ್ವೀಕರಿಸಿ')}</button>` : o.status === 'accepted' ? `<button class="btn small" onclick="orderAction(${o.id},'ready')">${t('Mark ready', 'ಸಿದ್ಧವಾಗಿದೆ')}</button>` : o.status === 'ready' ? `<button class="btn green small" onclick="confirmComplete(${o.id})">${t('Mark handed over', 'ಹಸ್ತಾಂತರಿಸಲಾಗಿದೆ')}</button>` : ''}</div></div></article>` }

        let windowInfo = null;

        function confirmPaid(id) { showModal(modalHead(t('Have you received the money?', 'ಹಣ ಬಂದಿದೆಯೇ?')) + `<p>${t('Check your own bank or UPI app first. This will be recorded as your confirmation, not bank verification.', 'ಮೊದಲು ನಿಮ್ಮ ಬ್ಯಾಂಕ್ ಅಥವಾ UPI ಆ್ಯಪ್ ಪರಿಶೀಲಿಸಿ. ಇದು ನಿಮ್ಮ ದೃಢೀಕರಣವಾಗಿ ದಾಖಲಾಗುತ್ತದೆ, ಬ್ಯಾಂಕ್ ಪರಿಶೀಲನೆ ಅಲ್ಲ.')}</p><button class="btn green" onclick="orders.find(o=>o.id===${id}).paid=true;document.getElementById('modal').close();render();toast(t('Receipt recorded','ಹಣ ಬಂದಿರುವುದು ದಾಖಲಾಗಿದೆ'))">${t('Yes, I received it', 'ಹೌದು, ಹಣ ಬಂದಿದೆ')}</button>`) }
        let chatMessage = '', chatDraft = null;
        function parseChat(text) { chatMessage = text; let isChakli = /chakli|ಚಕ್ಲಿ/i.test(text), nums = text.match(/\d+/g); if (isChakli && nums?.length >= 2) { chatDraft = { en: 'Homemade chakli', kn: 'ಮನೆಯ ಚಕ್ಲಿ', qty: Number(nums[0]), price: Number(nums[1]), unit: '250 g box', unitKn: '250 ಗ್ರಾಂ ಡಬ್ಬಿ', image: 'chakli' } } else if (isChakli && /ippattu|ಇಪ್ಪತ್ತು/i.test(text) && /nooraivattu|ನೂರೈವತ್ತು/i.test(text)) { chatDraft = { en: 'Homemade chakli', kn: 'ಮನೆಯ ಚಕ್ಲಿ', qty: 20, price: 150, unit: '250 g box', unitKn: '250 ಗ್ರಾಂ ಡಬ್ಬಿ', image: 'chakli' } } else chatDraft = null; render() }
        function sendChat(e) { e.preventDefault(); parseChat(new FormData(e.target).get('message').trim()) }
        function sampleChat(l) { parseChat(l === 'kn' ? 'ಇಪ್ಪತ್ತು ಡಬ್ಬಿ ಚಕ್ಲಿ, ಪ್ರತಿ ಡಬ್ಬಿಗೆ ನೂರೈವತ್ತು ರೂಪಾಯಿ' : '20 boxes of chakli, 150 rupees per box') }
        function confirmChat() { editProduct(null, chatDraft) }
        document.documentElement.lang = lang === 'kn' ? 'kn' : 'en'; render();
        if (document.modelContext?.registerTool) { try { document.modelContext.registerTool({ name: 'set_seller_view', title: 'Open a seller app view', description: 'Navigate this sample seller app to a selected view without changing orders or products.', inputSchema: { type: 'object', properties: { view: { type: 'string', enum: ['home', 'orders', 'products', 'money', 'passport', 'chat'] } }, required: ['view'], additionalProperties: false }, annotations: { readOnlyHint: true }, execute(input) { if (!['home', 'orders', 'products', 'money', 'passport', 'chat'].includes(input.view)) throw new Error('Unknown view'); navigate(input.view); return { view, language: lang } } }) } catch (e) { console.warn('Optional browser tools unavailable') } }
    </script>
